<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover lets the canvas run under the iPad rounded corners and Stage Manager chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DrawCraft</title>
    <meta name="description" content="Handwriting, PDF annotation and study notebooks. Pure Rust, running offline in your browser.">

    <!-- Installable PWA (iPadOS: Share, then Add to Home Screen). -->
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DrawCraft">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="storage_adapter.js" />
    <link data-trunk rel="copy-dir" href="assets/icons" />
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

    <link data-trunk rel="rust" data-bin="drawcraft_app" data-wasm-opt="0" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #F5F5F7;
            /* Safari must never treat ink as scrolling, selection, callouts or zoom gestures. */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        @media (prefers-color-scheme: dark) {
            html, body { background-color: #0E0E10; }
            #loading { color: #F2F2F5; }
            #loading .spinner { border-color: rgba(255, 255, 255, 0.15); border-top-color: #4D8BFF; }
            #loading .hint { color: #8E8E93; }
        }

        #the_canvas_id {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            outline: none;
        }

        #the_canvas_id:focus-visible {
            outline: 2px solid #4D8BFF;
            outline-offset: -2px;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #1C1C1E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            pointer-events: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #loading .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(22, 23, 26, 0.12);
            border-top-color: #0068F5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #loading .hint { font-size: 0.85rem; color: #66666B; }

        #fatal {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #F2F2F5;
            background: #141416;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            #loading .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>Loading DrawCraft</div>
        <div class="hint">Your notebooks stay on this device.</div>
    </div>
    <div id="fatal" role="alert">
        <div>
            <p>DrawCraft could not start in this browser.</p>
            <p class="hint">It needs WebAssembly and WebGPU or WebGL2. Please update Safari, Chrome or Firefox.</p>
        </div>
    </div>

    <canvas id="the_canvas_id" tabindex="0" aria-label="Notebook page"></canvas>

    <!-- Persistence adapter (OPFS with IndexedDB fallback). Plain JS glue, no application logic. -->
    <script src="storage_adapter.js"></script>
    <script>
        // Offline shell. Service workers need HTTPS or localhost, so this is skipped on plain LAN HTTP.
        if ('serviceWorker' in navigator && window.isSecureContext) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('Service worker not registered:', err);
                });
            });
        }
        // iPadOS: stop double-tap zoom and rubber-banding outside the canvas.
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
        window.addEventListener('error', function () {
            var loading = document.getElementById('loading');
            if (loading && loading.parentNode) {
                var fatal = document.getElementById('fatal');
                if (fatal) { fatal.style.display = 'flex'; }
            }
        });
    </script>
</body>
</html>
