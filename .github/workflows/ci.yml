name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: fmt, clippy (native + wasm32), layers, panic-hunt, tests
        run: cargo xtask ci
      - name: Web bundle
        run: cargo xtask web-build